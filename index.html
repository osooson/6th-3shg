<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리집 연금 소득</title>
<meta name="theme-color" content="#EDF1F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1A25" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="연금 소득">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF1F4; --sheet:#FFFFFF; --ink:#15283C; --muted:#5B6B7B; --line:#CBD5DE;
  --self:#2E8B57; --spouse:#D4688F; --g1:#1F6E45; --g2:#2E8B57; --g3:#52A877; --g4:#82C49D; --g5:#B3DEC4; --p1:#A3426A; --p2:#C95C87; --p3:#DD80A3; --p4:#EBA7C0; --p5:#F5CEDC; --tax:#B3BDC7; --taxbar:#8C99A6; --warn:#B4441F; --warnbg:#FBEDE7; --accent:#D3921A;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1A25; --sheet:#172636; --ink:#E4ECF3; --muted:#93A4B4; --line:#2A3D50;
    --self:#6CC28F; --spouse:#F28DB2; --g1:#2F8A5A; --g2:#4CAB76; --g3:#6CC28F; --g4:#97D7B0; --g5:#C2EBD2; --p1:#B44F7A; --p2:#D46A93; --p3:#F28DB2; --p4:#F6B1CA; --p5:#FAD3E2; --tax:#3C4E60; --taxbar:#7D8B99; --warn:#F08A63; --warnbg:#3A2219; --accent:#E8AE42;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1A25; --sheet:#172636; --ink:#E4ECF3; --muted:#93A4B4; --line:#2A3D50;
  --self:#6CC28F; --spouse:#F28DB2; --tax:#3C4E60; --taxbar:#7D8B99; --warn:#F08A63; --warnbg:#3A2219; --accent:#E8AE42;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 56px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--self);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.hwrap{max-width:720px;margin:0 auto;padding:10px 16px 0;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
/* home-screen app: keep the header below the system's blurred status-bar edge */
@media (display-mode: standalone){ .hwrap{padding-top:24px} }
.brand{font-weight:700;font-size:16px;padding-bottom:10px}
nav{display:flex;gap:2px}
nav button{border:0;background:none;padding:8px 12px 10px;font-size:15px;color:var(--muted);border-bottom:3px solid transparent}
nav button[aria-current="page"]{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
main{max-width:720px;margin:0 auto;padding:18px 16px 96px}
h2{font-size:17px;margin:0}
h3{font-size:15px;margin:0}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.hint{font-size:12.5px;color:var(--muted);margin:6px 0 0}

/* segmented */
.seg{display:flex;background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:7px;padding:8px 6px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:600}
.controls{display:grid;gap:10px;margin-bottom:18px}
.ctlrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.seg.sm{padding:2px;gap:2px;border-radius:9px}
.seg.sm button{flex:0 0 auto;padding:6px 10px;font-size:13px;border-radius:7px}
.seg.mini button{padding:6px 9px;font-size:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:36px;height:36px;border:1px solid var(--line);background:var(--sheet);border-radius:8px;font-size:18px;line-height:1}
.stepper input{width:64px;text-align:center;padding:7px;border:1px solid var(--line);border-radius:8px;background:var(--sheet);font-size:16px}

/* hero */
.lead{font-size:clamp(20px,5.2vw,27px);line-height:1.4;margin:0 0 4px;font-weight:500}
.lead .amt{font-size:1.5em;font-weight:700}
.chartwrap{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:10px 6px 4px;margin-top:12px}
svg.chart{display:block;width:100%;height:auto}
@keyframes barGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
svg.chart.anim .bar{transform-box:fill-box;transform-origin:50% 100%;animation:barGrow .5s cubic-bezier(.2,.7,.3,1) both}
svg.chart.anim .baseline{animation:fadeIn .4s ease both}
@media (prefers-reduced-motion:reduce){svg.chart.anim .bar,svg.chart.anim .baseline{animation:none}}
svg.chart text{fill:var(--muted);font-size:9px}
.legend{display:flex;flex-wrap:wrap;gap:12px;padding:6px 8px 4px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.legend[hidden]{display:none}
.legtog{display:block;margin:2px 6px 0 auto;border:0;background:none;color:var(--muted);font-size:12px;padding:4px 4px}
.legend i.line{height:0;border-top:2px dashed var(--ink);border-radius:0;vertical-align:3px}
.callout{margin-top:12px;background:var(--warnbg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.55}
.callout.info{background:var(--sheet);color:var(--ink);border:1px solid var(--line)}

.items{list-style:none;margin:14px 0 0;padding:0}
.items li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.items li:last-child{border-bottom:0}
.items li.sub{border-bottom:1px dashed var(--line);padding:0 0 8px;margin-top:-4px}
.items li:has(+ li.sub){border-bottom:0}
.items .tag{font-size:12px;color:var(--muted);margin-left:6px}
.items .r{text-align:right;white-space:nowrap}
.items .r small{display:block;color:var(--muted);font-size:11.5px}

section{margin-top:28px}
.tablewrap{overflow:auto;max-height:420px;border:1px solid var(--line);border-radius:10px;background:var(--sheet);margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:13px;table-layout:fixed}
th,td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
th:first-child,td:first-child{width:27%}
td small,th small{display:block;font-size:10.5px;font-weight:400;color:var(--muted)}
th{position:sticky;top:0;background:var(--sheet);font-weight:600;color:var(--muted);font-size:12px;z-index:1}
th:first-child,td:first-child{text-align:left}
tr.sel td{background:var(--paper);font-weight:700}
tr.dead td:first-child{color:var(--warn)}
tbody tr{cursor:pointer}

/* accounts */
.owner{margin-top:26px}
.owner:first-child{margin-top:0}
.ohead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.card{background:var(--sheet);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:12px 12px 10px 14px;margin-bottom:8px}
.card .top{display:flex;justify-content:space-between;gap:10px}
.card .name{font-weight:600}
.card .val{font-weight:600;white-space:nowrap}
.card .meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.card .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.btn{border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:8px 14px;font-size:14px}
.btn.sm{padding:5px 12px;font-size:13px}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:600}
.btn.danger{color:var(--warn)}
.btn.dangerfill{background:var(--warn);color:#fff;border-color:var(--warn)}
.confirm{margin-top:8px;background:var(--warnbg);color:var(--warn);border-radius:8px;padding:8px 8px 8px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13.5px;font-weight:600}
.confirm div{display:flex;gap:6px}
.flag{margin-top:8px;background:var(--warnbg);color:var(--warn);border-radius:6px;padding:7px 10px;font-size:12.5px}
.empty{border:1.5px dashed var(--line);border-radius:10px;padding:14px;color:var(--muted);font-size:14px}
.add{border:0;background:none;color:var(--self);font-weight:600;padding:8px 2px}

/* form */
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
.form h3{grid-column:1/-1;margin-top:8px;padding-top:12px;border-top:1px solid var(--line)}
label{display:block;font-size:12.5px;color:var(--muted)}
label input:not([type=checkbox]),label select,textarea{display:block;width:100%;margin-top:3px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--sheet);font-size:16px;color:var(--ink)}
label .conv{display:block;font-size:11.5px;margin-top:2px;height:16px;line-height:16px;overflow:hidden}
label.chk{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:14px}
.back{border:0;background:none;color:var(--self);font-weight:600;padding:4px 0 12px;font-size:15px}
.dd{position:relative}
.ddbtn{width:100%;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--sheet);border-radius:10px;padding:9px 12px;text-align:left}
.ddbtn b{flex:1;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ddbtn .caret{color:var(--muted);transition:transform .15s}
.dd.open .ddbtn .caret{transform:rotate(180deg)}
.ddmenu{display:none;margin-top:4px;background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:4px}
.dd.open .ddmenu{display:block}
.ddmenu > button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:10px 8px;border-radius:7px;font-size:14px;text-align:left}
.ddmenu > button[aria-checked="true"]{background:var(--paper);font-weight:600}
.ddmenu .ck{width:16px;color:var(--self);font-weight:700}
.ddmenu i{width:8px;height:8px;border-radius:50%;display:inline-block}
.ddmenu small{color:var(--muted);font-size:11.5px;margin-left:auto}
.ddfoot{display:flex;justify-content:flex-end;padding:6px 4px 2px;border-top:1px solid var(--line);margin-top:4px}
svg.chart{touch-action:pan-y;cursor:pointer;user-select:none;-webkit-user-select:none}
.sched{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--sheet)}
.shead,.srow{display:grid;grid-template-columns:1fr 1fr 1.6fr 28px;gap:6px;align-items:center}
.shead{font-size:11.5px;color:var(--muted);margin-bottom:4px}
.srow{margin-bottom:6px}
.srow input{width:100%;padding:8px;border:1px solid var(--line);border-radius:7px;background:var(--paper);font-size:16px;color:var(--ink)}
.srow .x{border:0;background:none;color:var(--muted);font-size:18px}
.footbar{position:sticky;bottom:0;margin:18px -16px 0;padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 12px);background:var(--paper);border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.settings{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:14px}
#errbar{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:20;background:var(--warn);color:#fff;border-radius:10px;padding:10px 12px;font-size:13px;display:none}
#errbar button{float:right;border:0;background:none;color:#fff;font-weight:700}
@media (max-width:400px){ nav button{padding:8px 9px 10px} }
</style>
</head>
<body>
<header><div class="hwrap"><span class="brand">우리집 연금 소득</span>
<nav aria-label="화면"><button type="button" data-tab="flow">흐름</button><button type="button" data-tab="accounts">계좌</button><button type="button" data-tab="settings">가정</button></nav></div></header>
<main id="app"></main>
<div id="errbar" role="alert"></div>
<script>
"use strict";
/* ================= error banner ================= */
window.addEventListener("error", e=>showErr(e.message));
window.addEventListener("unhandledrejection", e=>showErr(e.reason && e.reason.message || String(e.reason)));
function showErr(msg){
  const b = document.getElementById("errbar"); if(!b) return;
  b.innerHTML = `<button type="button" aria-label="닫기">×</button>오류가 생겼습니다: ${esc(msg)}`;
  b.style.display = "block";
  b.querySelector("button").onclick = ()=>{ b.style.display="none"; };
}

/* ================= constants ================= */
const YEAR = new Date().getFullYear();
const OWN = {self:"본인", spouse:"배우자"};
const other = o => o==="self" ? "spouse" : "self";
const TYPES = {
  nps:  {label:"국민연금"},
  ps:   {label:"연금저축", invest:true},
  irp:  {label:"IRP", invest:true},
  dc:   {label:"퇴직연금 DC", invest:true},
  annK: {label:"연금보험(원화)", annuity:true},
  annU: {label:"연금보험(달러)", annuity:true, usd:true},
  etc:  {label:"기타(주택연금 등)"}
};
const DEFAULT_DEATH = {ps:"inherit", irp:"lump", dc:"lump", annK:"stop", annU:"stop", etc:"spouse"};

/* ================= state ================= */
function blankState(){
  return {settings:{birthSelf:1970, birthSpouse:1972, rate:4, inflation:2, fx:1400, confirmed:false},
          accounts:[], deleted:{}, settingsAt:0, ui:{scenario:"both", deathAge:80, real:true, selAge:65}};
}
let S = blankState();
let view = "flow", draft = null, pendingDel = null, pendingReset = false, animateChart = true;
const uid = ()=>Math.random().toString(36).slice(2,10);
const num = v => (v===""||v==null||isNaN(+v)) ? 0 : +v;
const birth = o => num(o==="self"?S.settings.birthSelf:S.settings.birthSpouse);
const ageNow = o => YEAR - birth(o);

function sampleState(){
  const s = blankState();
  s.settings.confirmed = true;
  s.accounts = [
    {id:uid(),owner:"self",type:"nps",name:"국민연금",months:360,monthly:1650000,startAge:65,taxRatio:85},
    {id:uid(),owner:"self",type:"ps",name:"연금저축",institution:"증권사",paid:30000000,earn:12000000,contrib:500000,contribUntil:60,nondeduct:5000000,startAge:60,payoutYears:20,onDeath:"inherit"},
    {id:uid(),owner:"self",type:"irp",name:"IRP",institution:"증권사",paid:15000000,earn:4000000,contrib:250000,contribUntil:60,retireFuture:150000000,retireAge:60,retireRate:4,startAge:60,payoutYears:20,onDeath:"lump"},
    {id:uid(),owner:"spouse",type:"nps",name:"국민연금",months:120,monthly:350000,startAge:65,taxRatio:100},
    {id:uid(),owner:"spouse",type:"annK",name:"연금보험",payMode:"monthly",premium:500000,payYears:5,monthly:330000,startAge:65,payoutYears:0,taxFree:true,onDeath:"stop"},
    {id:uid(),owner:"spouse",type:"annU",name:"달러연금보험",payMode:"lump",premium:50000,monthly:220,startAge:65,payoutYears:0,taxFree:true,onDeath:"stop"}
  ];
  return s;
}

/* ================= money ================= */
const fx = ()=>num(S.settings.fx)||1400;
const infl = ()=>num(S.settings.inflation)/100;
const idx = y => Math.pow(1+infl(), y-YEAR);
function man(v){
  const m = Math.round(v/10000);
  if(Math.abs(m)>=10000){ const e=Math.trunc(m/10000), r=Math.abs(m%10000); return e+"억"+(r? " "+r.toLocaleString()+"만":"")+"원"; }
  return m.toLocaleString()+"만원";
}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

/* ================= invest account projection ================= */
const flowCache = new Map();
function balanceNow(a){
  const t = TYPES[a.type];
  if(t.invest) return num(a.paid)+num(a.earn);
  if(t.annuity) return (num(a.paid)+num(a.earn))*(t.usd?fx():1);
  return 0;
}
function flows(a){
  if(flowCache.has(a.id)) return flowCache.get(a.id);
  const i = num(a.rate!==undefined && a.rate!=="" ? a.rate : S.settings.rate)/100/12, gy = Math.pow(1+i,12)-1;
  const now = ageNow(a.owner);
  const plan = a.payMode2==="plan" ? (a.schedule||[]).filter(r=>num(r.from)) : null;
  const start = plan && plan.length ? Math.min(...plan.map(r=>num(r.from))) : (num(a.startAge)||60);
  const planEnd = plan && plan.length ? Math.max(...plan.map(r=>num(r.to)||num(r.from))) : 0;
  const cEnd = Math.min(num(a.contribUntil)||start, start);
  const nAcc = Math.max(0,(start-now)*12), nC = Math.max(0,(cEnd-now)*12), c = num(a.contrib);
  // contributions until cEnd, then grow to start
  let fvC = i ? c*(Math.pow(1+i,nC)-1)/i : c*nC; fvC *= Math.pow(1+i, nAcc-nC);
  let fv = balanceNow(a)*Math.pow(1+i,nAcc) + fvC;
  let nd = a.type==="dc" ? 0 : num(a.nondeduct) + (a.contribDeduct===false ? c*nC : 0);
  let rt = a.type==="dc" ? fv : a.type==="irp" ? num(a.retire) : 0;
  if(nd+rt>fv && fv>0){ const k=fv/(nd+rt); nd*=k; rt*=k; }
  let tx = Math.max(0, fv-nd-rt);
  if(a.type==="irp" && num(a.retireFuture)>0){
    const ra = Math.max(num(a.retireAge)||60, now), m2 = Math.max(0,(start-ra)*12);
    const amt = num(a.retireFuture), g = amt*Math.pow(1+i,m2);
    rt += amt; tx += g-amt; fv += g;
  }
  const yrs = plan ? Math.max(1, planEnd - start + 1) : Math.max(1, num(a.payoutYears)||20), n = yrs*12;
  // level payments, or (indexed) payments growing with inflation so they keep today's value
  const ga = infl(), ra = gy;
  const P = a.indexed
    ? (Math.abs(ra-ga)<1e-9 ? fv/yrs : fv*(ra-ga)/((1-Math.pow((1+ga)/(1+ra), yrs))*(1+ra)))
    : 12*(i ? fv*i/(1-Math.pow(1+i,-n)) : fv/n);
  const years = [];
  // 연금수령연차: year 1 = first year the account is eligible (age 55+ and 5 years since opening); old-plan 퇴직금 starts at 6
  const openAge = num(a.openYear) ? num(a.openYear) - birth(a.owner) : 0;
  const hasRetire = a.type==="dc" || num(a.retire)>0 || num(a.retireFuture)>0;
  const eligAge = Math.max(55, hasRetire ? openAge : openAge + 5); // 퇴직금이 든 계좌는 가입 5년 요건 없음
  const firstYearNo = a.oldPlan ? Math.max(6, start - eligAge + 1) : Math.max(1, start - eligAge + 1);
  for(let k=0;k<yrs;k++){
    const bal = nd+rt+tx;
    let w;
    if(plan){ // 나이 구간별 월 인출 계획 (현재가치 입력이면 그해 금액으로 환산)
      const age = start + k, row = plan.find(r=>age>=num(r.from) && age<=(num(r.to)||num(r.from)));
      const want = row ? num(row.monthly)*12*(a.planReal===false ? 1 : idx(birth(a.owner)+age)) : 0;
      w = Math.min(want, bal);
    } else w = k===yrs-1 ? bal : Math.min(P*(a.indexed ? Math.pow(1+ga,k) : 1), bal);
    const yearNo = firstYearNo + k;
    const limit = yearNo<=10 ? bal/(11-yearNo)*1.2 : Infinity; // 연금수령한도 (whole account)
    let inLim = Math.min(w, limit);
    const take = v=>{ const t=Math.min(v,w); w-=t; return t; };
    // within-limit portion first, then excess (연금외수령); buckets in legal order
    const split = amt=>{ const pIn = Math.min(amt, inLim); inLim -= pIn; return [pIn, amt-pIn]; };
    const wn=take(nd); nd-=wn; const [nP,nX]=split(wn);
    const wr=take(rt); rt-=wr; const [rP,rX]=split(wr);
    const wt=take(tx); tx-=wt; const [tP,tX]=split(wt);
    tx += (nd+rt+tx)*gy;
    years.push({nonded:wn, retire:rP, retireX:rX, taxable:tP, taxableX:tX, total:wn+wr+wt, k, yearNo, remain:nd+rt+tx});
  }
  let exhaustAge = 0;
  if(plan){ const kk = years.findIndex(y=>y.remain<1 && y.k<yrs-1); if(kk>=0) exhaustAge = start+kk; }
  const leftover = years.length ? years[years.length-1].remain : fv;
  const r = {start, years, fv, plan:!!plan, exhaustAge, leftover, end: start+yrs-1,
    valueAtAge(age){ // rough account value at owner's age (for lump-sum on death)
      if(age>=start){ const k=age-start-1; return k<0? fv : (years[k]? years[k].remain : 0); }
      const m = Math.max(0,(age-now)*12), mc = Math.min(m, nC);
      let v = balanceNow(a)*Math.pow(1+i,m) + (i? c*(Math.pow(1+i,mc)-1)/i : c*mc)*Math.pow(1+i,m-mc);
      if(a.type==="irp" && age>=(num(a.retireAge)||60)) v += num(a.retireFuture);
      return v;
    }};
  flowCache.set(a.id, r); return r;
}

/* gross annual income of account a in year y as if owner alive (nominal KRW) */
function acctYear(a, y){
  const t = TYPES[a.type], age = y - birth(a.owner);
  const sch = (t.annuity || a.type==="etc") && a.calcMode==="schedule" ? (a.schedule||[]).filter(r=>num(r.from)) : null;
  const start = sch ? (sch.length ? Math.min(...sch.map(r=>num(r.from))) : 999) : t.invest ? flows(a).start : (num(a.startAge)||65);
  const z = {gross:0, privTaxable:0, pubTaxable:0, retireTax:0};
  if(age < start) return z;
  if(sch){ // 가입설계서 지급표: the row covering this age decides the monthly amount
    const row = sch.find(r=>age>=num(r.from) && age<=(num(r.to)||num(r.from)));
    z.gross = row ? num(row.monthly)*12*(t.usd?fx():1) : 0;
    return z;
  }
  if(t.invest){
    const row = flows(a).years[age-start]; if(!row) return z;
    z.gross = row.total; z.privTaxable = row.taxable;
    const rr = num(a.retireRate??4)/100;
    z.retireTax = row.retire*rr*(row.k<10?0.7:0.6)   // 퇴직금 원금, 연금수령: 퇴직소득세 70%(11년차부터 60%)
                + row.retireX*rr                     // 한도 초과: 퇴직소득세 100%
                + row.taxableX*0.165;                // 한도 초과 운용수익 등: 기타소득 16.5%
    z.parts = row;
  } else if(a.type==="nps"){
    if(num(a.months)>=120){ z.gross = num(a.monthly)*12*idx(y); z.pubTaxable = z.gross*num(a.taxRatio??100)/100; }
  } else {
    let monthly = num(a.monthly), yrs = num(a.payoutYears);
    if(t.annuity && a.calcMode==="auto"){ const c = annuityCalc(a); monthly = c.monthly; yrs = c.years; }
    if(yrs && age>=start+yrs) return z;
    z.gross = monthly*12*(t.usd?fx():1);
  }
  return z;
}

/* ================= tax (2026 rules, estimate) ================= */
function pensionDeduction(x){
  const d = x<=3.5e6 ? x : x<=7e6 ? 3.5e6+(x-3.5e6)*.4 : x<=1.4e7 ? 4.9e6+(x-7e6)*.2 : 6.3e6+(x-1.4e7)*.1;
  return Math.min(d, 9e6);
}
const BR=[[1.4e7,.06],[5e7,.15],[8.8e7,.24],[1.5e8,.35],[3e8,.38],[5e8,.40],[1e9,.42],[Infinity,.45]];
function incomeTax(b){ let t=0,p=0; for(const [c,r] of BR){ if(b<=p) break; t+=(Math.min(b,c)-p)*r; p=c; } return t; }
function compTax(inc){ if(inc<=0) return 0; const base=Math.max(0,inc-pensionDeduction(inc)-1.5e6); return Math.max(0,incomeTax(base)-7e4)*1.1; }
const lowRate = age => age<70?.055:age<80?.044:.033;
function personTax(items, age){
  const PT = items.reduce((s,x)=>s+x.privTaxable,0), PU = items.reduce((s,x)=>s+x.pubTaxable,0);
  let priv, pub, method="none";
  if(PT<=1.5e7){ priv = PT*lowRate(age); pub = compTax(PU); if(PT>0) method="low"; }
  else { const sep = PT*.165+compTax(PU), comp = compTax(PU+PT);
    if(sep<=comp){ method="sep"; priv=PT*.165; pub=compTax(PU); }
    else { method="comp"; priv=comp*PT/(PU+PT); pub=comp-priv; } }
  items.forEach(x=>{ x.tax = x.retireTax + (PT? priv*x.privTaxable/PT : 0) + (PU? pub*x.pubTaxable/PU : 0); });
  return {PT, PU, method};
}

/* ================= scenario simulation ================= */
function survivorRate(m){ return m>=240?.6 : m>=120?.5 : .4; }
let seriesMeta = {};
function simulate(scn){
  seriesMeta = {};
  const dead = scn==="self"||scn==="spouse" ? scn : null;
  const deathYear = dead ? birth(dead)+num(S.ui.deathAge) : Infinity;
  const a0 = Math.max(ageNow("self"),50), a1 = 100, rows = [];
  for(let ageS=a0; ageS<=a1; ageS++){
    const y = birth("self")+ageS;
    const alive = o => !(dead===o && y>=deathYear);
    const items = {self:[], spouse:[]}; const notes = [];
    for(const a of S.accounts){
      const o = a.owner, t = TYPES[a.type];
      if(alive(o)){
        if(a.type==="nps" && dead && !alive(other(o))) continue; // survivor NPS handled below
        const z = acctYear(a,y); if(z.gross>0) items[o].push({a, name:a.name, tag:"", ...z});
        continue;
      }
      if(!alive(other(o)) || a.type==="nps") continue;
      const od = a.onDeath || DEFAULT_DEATH[a.type];
      if(t.invest){
        if(od==="inherit"){ const z = acctYear(a,y); if(z.gross>0) items[other(o)].push({a, name:a.name, tag:"승계", ...z}); }
        else if(y===deathYear){ const v = flows(a).valueAtAge(num(S.ui.deathAge)); if(v>0) notes.push(`${a.name}: 연금 대신 일시금 약 ${man(v)} 상속`); }
      } else if(od==="spouse"){
        const z = acctYear(a,y); if(z.gross>0) items[other(o)].push({a, name:a.name, tag:"배우자 계속", ...z});
      }
    }
    if(dead && y>=deathYear){
      const s = other(dead);
      const dn = S.accounts.find(a=>a.owner===dead && a.type==="nps");
      const sn = S.accounts.find(a=>a.owner===s && a.type==="nps");
      let surv = 0;
      if(dn && num(dn.months)>=120){
        surv = (num(dn.survivorMonthly) || num(dn.monthly)*survivorRate(num(dn.months)))*12*idx(y);
      }
      const own = sn ? acctYear(sn,y) : {gross:0,pubTaxable:0};
      if(surv>0 || own.gross>0){
        if(own.gross>0 && own.gross+0.3*surv >= surv){
          items[s].push({a:sn, name:sn.name, tag:"", ...own, privTaxable:0, retireTax:0});
          if(surv>0) items[s].push({a:dn, name:"유족연금 30%", tag:"비과세", gross:0.3*surv, privTaxable:0, pubTaxable:0, retireTax:0});
        } else if(surv>0){
          items[s].push({a:dn, name:"유족연금", tag:own.gross>0?"본인 연금 대신 선택, 비과세":"비과세", gross:surv, privTaxable:0, pubTaxable:0, retireTax:0});
        }
      }
    }
    const tax = {};
    for(const o of ["self","spouse"]) tax[o] = personTax(items[o], y-birth(o));
    const flt = S.ui.filter, pick = x => !flt || (x.a && flt.includes(x.a.id));
    const sum = (o,f)=>items[o].filter(pick).reduce((s,x)=>s+f(x),0);
    const d = S.ui.real ? idx(y) : 1;
    const r = {ageS, ageP:y-birth("spouse"), y, alive:{self:alive("self"), spouse:alive("spouse")}, items, tax, notes,
      net:{self:sum("self",x=>x.gross-x.tax)/12/d, spouse:sum("spouse",x=>x.gross-x.tax)/12/d},
      taxM:(sum("self",x=>x.tax)+sum("spouse",x=>x.tax))/12/d, d};
    r.total = r.net.self + r.net.spouse; r.gross = r.total + r.taxM;
    // per-product series (recipient + source account) for the stacked chart
    r.series = {};
    for(const o of ["self","spouse"]) for(const x of items[o].filter(pick)){
      if(!(x.gross>0)) continue;
      const surv = /유족연금/.test(x.name);
      const key = x.a && x.a.type==="irp" && !surv ? `${o}:irp` : `${o}:${x.a?x.a.id:"x"}${surv?":s":""}`;
      r.series[key] = (r.series[key]||0) + (x.gross-x.tax)/12/d;
      if(!seriesMeta[key]) seriesMeta[key] = {o, name: key.endsWith(":irp") ? (S.accounts.filter(a=>a.type==="irp").length>1 ? "IRP 합산" : "IRP") : x.name + (x.a && x.a.owner!==o && !surv ? " (승계)" : "")};
    }
    rows.push(r);
  }
  return rows;
}

/* ================= persistence ================= */
const LS = "household-pension-v2";
let docRef = null, saveTimer = null, writing = false, pendingWrite = false, lastWritten = "";
function setStatus(t){ S._status = t; const el = document.getElementById("status"); if(el) el.textContent = t; }
/* shared part = what syncs between devices; ui (scenario, selected age) stays per device */
function sharedPart(st){ return {settings:st.settings||{}, accounts:st.accounts||[], deleted:st.deleted||{}, settingsAt:num(st.settingsAt)}; }
function saveLocal(){ try{ const d = JSON.parse(JSON.stringify(S)); delete d._status; localStorage.setItem(LS, JSON.stringify(d)); }catch{} }
function commitUi(){ saveLocal(); }
function commit(){ flowCache.clear(); saveLocal(); clearTimeout(saveTimer); saveTimer = setTimeout(persist, 600); }
async function persist(){
  if(!docRef){ setStatus("이 기기에 저장됨"); return; }
  if(writing){ pendingWrite = true; return; }
  writing = true;
  try{
    const data = sharedPart(S), js = JSON.stringify(data);
    if(js!==lastWritten){ await docRef.set({shared:JSON.parse(js)}); lastWritten = js; }
    setStatus(mode==="household" ? "가구 공유 데이터에 저장됨" : "내 계정에 저장됨");
  }catch(e){
    const c = e && e.code;
    setStatus(mode==="household" && (c==="permission-denied"||c==="forbidden"||/permission|denied|forbidden/i.test(String(e&&e.message)))
      ? "가구 데이터를 고칠 권한이 없어 이 기기에만 저장했습니다. 아티팩트 공유 메뉴에서 편집자로 초대받아야 합니다."
      : "이 기기에만 저장됨 (계정 저장 실패)");
  }
  writing = false;
  if(pendingWrite){ pendingWrite = false; persist(); }
}
/* merge remote into local: per-account newest wins, deletions are remembered */
function mergeShared(remote){
  const del = Object.assign({}, remote.deleted||{});
  for(const [k,v] of Object.entries(S.deleted||{})) del[k] = Math.max(num(v), num(del[k]));
  const map = new Map();
  for(const a of [...(remote.accounts||[]), ...(S.accounts||[])]){ const p = map.get(a.id); if(!p || num(a.updatedAt) >= num(p.updatedAt)) map.set(a.id, a); }
  const order = [...(S.accounts||[]).map(a=>a.id), ...(remote.accounts||[]).map(a=>a.id)], seen = new Set(), accts = [];
  for(const id of order){ if(seen.has(id)) continue; seen.add(id); const a = map.get(id); if(a && !(del[id] && num(del[id]) >= num(a.updatedAt))) accts.push(a); }
  const before = JSON.stringify(sharedPart(S));
  if(num(remote.settingsAt) > num(S.settingsAt) || (!num(S.settingsAt) && !S.settings.confirmed && remote.settings && remote.settings.birthSelf)){ S.settings = Object.assign({}, S.settings, remote.settings); S.settingsAt = Math.max(num(remote.settingsAt), num(S.settingsAt)); }
  S.accounts = accts; S.deleted = del;
  const after = JSON.stringify(sharedPart(S));
  return {changed: before!==after, needsPush: after!==JSON.stringify(sharedPart(remote))};
}
function loadLocal(){ try{ const l = localStorage.getItem(LS); if(l){ const d = JSON.parse(l); if(d && d.accounts) S = Object.assign(blankState(), d); } }catch{} }
/* ---------- private (per account) or household (shared with invited editors) ---------- */
const HH = "households/main";
let dbH = null, userId = null, unsub = null, householdAvailable = false;
let mode = (()=>{ try{ return localStorage.getItem("hp-mode")||"private"; }catch{ return "private"; } })();
function setMode(m){ mode = m; try{ localStorage.setItem("hp-mode", m); }catch{} }
function replaceShared(remote){
  S.accounts = (remote.accounts||[]).map(a=>Object.assign({}, a));
  S.settings = Object.assign({}, blankState().settings, remote.settings||{});
  S.deleted = Object.assign({}, remote.deleted||{}); S.settingsAt = num(remote.settingsAt);
  flowCache.clear(); saveLocal(); animateChart = true;
}
function attach(replace){
  if(!dbH) return;
  if(typeof unsub==="function"){ try{ unsub(); }catch{} }
  docRef = dbH.doc(mode==="household" ? HH : `data/users/${userId}/pension-v2`);
  lastWritten = ""; let first = true;
  unsub = docRef.onSnapshot(snap=>{
    const d = snap && snap.exists ? (snap.data()||{}) : null;
    const remote = d && (d.shared || d.state);
    if(first && replace && remote){ first = false; replaceShared(remote); lastWritten = JSON.stringify(sharedPart(S)); if(view!=="edit") render(); setStatus("가구 공유 데이터를 불러왔습니다."); return; }
    first = false;
    if(!remote){ clearTimeout(saveTimer); saveTimer = setTimeout(persist, 600); return; }
    const r = mergeShared(remote);
    if(r.changed){ flowCache.clear(); saveLocal(); if(view!=="edit") render(); }
    if(r.needsPush){ clearTimeout(saveTimer); saveTimer = setTimeout(persist, 600); }
    else { lastWritten = JSON.stringify(sharedPart(S)); setStatus(mode==="household" ? "가구 공유 데이터와 동기화됨" : "내 계정과 동기화됨"); }
  }, ()=>{ setStatus(mode==="household" ? "가구 공유 데이터를 읽을 수 없습니다. 편집자로 초대받았는지 확인하세요." : "계정 연결이 끊겨 이 기기에만 저장 중"); });
}
async function probeHousehold(){
  if(!dbH || mode==="household") return;
  try{
    const snap = await dbH.doc(HH).get();
    householdAvailable = !!(snap && snap.exists);
    if(householdAvailable && !S.accounts.length){ setMode("household"); attach(true); return; }  // spouse opening for the first time
    if(householdAvailable && view==="settings") render();
  }catch{ householdAvailable = false; }
}
async function connectDb(){
  try{
    if(!window.claude || !window.claude.use) return;
    const db = await window.claude.use("db"), user = await window.claude.use("user");
    if(!db || !user) return;
    const id = await user.id(); if(!id) return;

}

/* annuity insurance: grow current balance + remaining premiums at the stated rate, then pay out evenly to the end age */
function annuityCalc(a){
  const t = TYPES[a.type];
  const rate = num(a.rate!==undefined && a.rate!=="" ? a.rate : (t.usd ? 0 : 2.5));
  const i = rate/100/12, now = ageNow(a.owner), start = num(a.startAge)||65;
  const years = Math.max(1, num(a.payoutYears) || (num(a.endAge) ? num(a.endAge)-start : 20)), end = start + years;
  const nAcc = Math.max(0,(start-now)*12), g = m => Math.pow(1+i, m);
  let base = num(a.paid)+num(a.earn);
  // lump-sum not yet reflected in the balance (e.g. just paid or about to pay): start from the premium itself
  if(base===0 && a.payMode==="lump") base = num(a.premium)*num(a.loadPct??95)/100;
  // phase 1: guaranteed (확정) rate for its remaining years, phase 2: crediting rate until start, phase 3: rate during payout
  const has = v => v!==undefined && v!=="";
  const i1 = has(a.fixRate) ? num(a.fixRate)/100/12 : i, fixM = has(a.fixRate) ? Math.max(0,num(a.fixYears))*12 : 0;
  const payRate = has(a.payRate) ? num(a.payRate) : rate, iPay = payRate/100/12;
  const payM = a.payMode!=="lump" ? Math.max(0, num(a.payLeft))*12 : 0, c = num(a.premium)*num(a.loadPct??95)/100;
  let fv = base;
  for(let m=0;m<nAcc;m++){ if(m<payM) fv += c; fv *= 1 + (m<fixM ? i1 : i); }
  const n = (end-start)*12;
  const monthly = iPay ? fv*iPay/(1-Math.pow(1+iPay,-n)) : fv/n;
  const label = (fixM ? `확정 ${num(a.fixRate)}% ${num(a.fixYears)}년 후 ` : "") + `적립 ${rate}%` + (payRate!==rate ? `, 수령 중 ${payRate}%` : "");
  return {rate, fv, monthly, years, end, label};
}
function annuityPreview(a){

    if(!auto && !num(a.monthly)) flag = "예상 월 연금이 비어 있어 0원으로 계산됩니다. 편집에서 보험사 예상액을 넣거나 ‘적립금·이율로 자동 계산’을 고르세요.";
    if(auto && ac.fv<=0) flag = "적립금과 보험료가 모두 0이라 연금이 0원으로 나옵니다. 납입한 보험료나 일시납 보험료를 넣어 주세요.";
    if(num(a.premium)) meta += a.payMode==="lump" ? ` / 일시납 ${fmtC(a.premium)}` : ` / 월 ${fmtC(a.premium)} × ${a.payYears||0}년납`;
    if(num(a.paid)||num(a.earn)) meta += ` / 적립금 ${fmtC(num(a.paid)+num(a.earn))}`;
    meta += `<br>${a.startAge||65}세 개시, ${a.calcMode==="auto" ? `${ac.years}년 수령` : num(a.payoutYears)?a.payoutYears+"년 확정":"종신"} / ${a.taxFree===false?"과세":"비과세"} / 사망 시 ${od==="spouse"?"배우자 계속 수령":"지급 종료"}`;
    const krw = num(a.premium)*(t.usd?fx():1);
    if(a.taxFree!==false && a.payMode==="lump" && krw>1e8) flag = `일시납 보험료가 원화 환산 ${man(krw)}로 비과세 한도 1억원을 넘습니다.`;
    if(a.taxFree!==false && a.payMode!=="lump" && krw>1.5e6) flag = `월 보험료가 150만원을 넘으면 월적립식 비과세 요건에서 벗어납니다.`;
  } else {
    val = a.monthly ? `월 ${man(num(a.monthly))}` : "예상액 미입력";
    meta += ` / ${a.startAge||65}세부터 ${num(a.payoutYears)?a.payoutYears+"년":"평생"} / 비과세 / 사망 시 ${od==="spouse"?"배우자 계속 수령":"지급 종료"}`;
  }
  return {val, meta, flag};
}
function viewAccounts(){
  let h = "";
  for(const o of ["self","spouse"]){
    const list = S.accounts.filter(a=>a.owner===o);
    const tot = list.reduce((s,a)=>s+balanceNow(a),0);
    h += `<div class="owner"><div class="ohead"><h2>${OWN[o]} <span class="small muted num">${ageNow(o)}세</span></h2><span class="small muted num">적립금 ${man(tot)}</span></div>`;
    if(!list.length) h += `<div class="empty">${OWN[o]} 명의 연금이 아직 없습니다.</div>`;
    list.forEach(a=>{
      const s = summary(a), c = o==="self"?"--self":"--spouse";
      h += `<div class="card" style="--c:var(${c})"><div class="top"><span class="name">${esc(a.name||TYPES[a.type].label)}</span><span class="val num">${s.val}</span></div>
        <div class="meta num">${s.meta}</div>${s.flag?`<div class="flag">${s.flag}</div>`:""}
        ${pendingDel===a.id
          ? `<div class="confirm">이 계좌를 삭제할까요?<div><button type="button" class="btn sm" data-act="delno">취소</button><button type="button" class="btn sm dangerfill" data-act="delyes" data-id="${a.id}">삭제</button></div></div>`
          : `<div class="acts"><button type="button" class="btn sm danger" data-act="del" data-id="${a.id}">삭제</button><button type="button" class="btn sm" data-act="edit" data-id="${a.id}">편집</button></div>`}
      </div>`;

/* ---------- edit view ---------- */
function F(label, key, opt={}){
  const v = draft[key] ?? opt.def ?? "";
  const money = opt.money;
  return `<label class="${opt.full?"full":""}">${label}<input type="${opt.text?"text":"number"}" ${opt.text?"":`inputmode="${opt.dec?"decimal":"numeric"}"`} data-f="${key}" ${money?`data-money="${money}"`:""} value="${esc(v)}">${money?`<span class="conv muted num" data-conv="${key}">${convText(v,money)}</span>`:""}</label>`;
}
function convText(v, kind){ if(v===""||v==null) return ""; return kind==="usd" ? `≈ ${man(num(v)*fx())}` : `= ${man(num(v))}`; }
function SEL(label, key, opts, opt={}){
  const v = draft[key] ?? opt.def;
  return `<label class="${opt.full?"full":""}">${label}<select data-f="${key}" ${opt.redraw?'data-redraw="1"':""}>${opts.map(([k,l])=>`<option value="${k}" ${String(v)===String(k)?"selected":""}>${l}</option>`).join("")}</select></label>`;
}
function CHK(label, key, def){ const on = draft[key] ?? def; return `<label class="chk full"><input type="checkbox" data-f="${key}" ${on?"checked":""}>${label}</label>`; }
function planPreview(d){
  flowCache.delete(d.id); const f = flows(d); flowCache.delete(d.id);
  if(!f.plan) return "구간을 입력하면 결과가 여기에 나타납니다.";
  const over = f.years.filter(r=>r.retireX+r.taxableX>1).length;
  let t = `→ ${f.start}세 적립금 약 ${man(f.fv)} (그해 금액). `;
  t += f.exhaustAge ? `<b style="color:var(--warn)">${f.exhaustAge}세에 잔고가 바닥납니다.</b> ` : f.leftover>1e4 ? `계획이 끝나는 ${f.end}세에 약 ${man(f.leftover)}이 남습니다. ` : `계획대로 모두 인출됩니다. `;
  if(over) t += `<b style="color:var(--warn)">연금수령한도를 넘는 해가 ${over}번 있어 그만큼 세금이 늘어납니다.</b>`;
  return t;
}
function scheduleEditor(a, cur, hint){
  const rows = a.schedule && a.schedule.length ? a.schedule : [{from:"",to:"",monthly:""}];
  if(!a.schedule || !a.schedule.length) draft.schedule = rows;
  let h = `<div class="full sched"><div class="shead"><span>시작 나이</span><span>끝 나이</span><span>월 금액 ${cur}</span><span></span></div>`;
  rows.forEach((r,i)=>{
    h += `<div class="srow"><input type="number" inputmode="numeric" data-sch="${i}" data-sf="from" value="${esc(r.from)}" aria-label="시작 나이"><input type="number" inputmode="numeric" data-sch="${i}" data-sf="to" value="${esc(r.to)}" aria-label="끝 나이"><input type="number" inputmode="decimal" data-sch="${i}" data-sf="monthly" value="${esc(r.monthly)}" aria-label="월 금액"><button type="button" class="x" data-act="schdel" data-i="${i}" aria-label="구간 삭제">×</button></div>`;
  });
  h += `<button type="button" class="add" data-act="schadd">+ 구간 추가</button>
    <p class="hint">${hint || "가입설계서나 보험사 앱의 ‘연금 예시표’에 나온 금액을 나이 구간별로 옮겨 적으세요. 확정이율, 보너스, 체증, 보증기간 같은 특별 조항이 이미 반영된 금액이라 앱이 따로 계산하지 않습니다. 보수적으로 보려면 최저보증이율 열의 금액을 쓰세요. 끝 나이를 비우면 그 한 해만 지급합니다."}</p></div>`;
  return h;
}

    } else {

    }

  } else {
    h += SEL("월 수령액 입력","calcMode",[["manual","정액"],["schedule","나이 구간별 금액 (증가형 등)"]],{redraw:true,def:"manual",full:true});
    if(a.calcMode==="schedule") h += scheduleEditor(a, "(원)");

    h += SEL("본인 사망 시","onDeath",[["spouse","배우자가 계속 수령"],["stop","지급 종료"]],{def:"spouse",full:true});

  const inp = (l,k,step)=>`<label>${l}<input type="number" inputmode="decimal" ${step?`step="${step}"`:""} data-set="${k}" value="${esc(s[k])}"></label>`;
  let h = `<div class="settings"><div class="form">${inp("본인 출생연도","birthSelf")}${inp("배우자 출생연도","birthSpouse")}${inp("기대수익률 (연 %)","rate","0.1")}${inp("물가상승률 (연 %)","inflation","0.1")}${inp("원/달러 환율","fx")}</div>
    <p class="hint">국민연금은 물가에 맞춰 오르고, 연금저축·IRP·연금보험은 정해진 금액을 받는다고 계산합니다. “오늘 가치로” 보기는 물가상승률로 나눠서 지금 돈의 구매력으로 보여줍니다. 세금은 2026년 세법 기준 추정치이고 건강보험료는 반영하지 않았습니다.</p></div>`;
  h += `<section><h2>가구 공유</h2>`;
  if(mode==="household"){
    h += `<div class="callout info" style="margin-top:8px">가구 공유 중입니다. 초대받은 배우자분도 같은 데이터를 보고 고칠 수 있어요.</div>
      <p class="hint">배우자분을 추가하려면 아티팩트 화면 위쪽 공유 메뉴에서 배우자분 이메일을 <b>편집자</b>로 초대하세요. 배우자분이 링크를 열면 이 데이터가 자동으로 나타납니다. 공개 링크로는 공유하지 마세요. 공개 링크가 켜져 있으면 초대받은 사람도 데이터를 고칠 수 없고, 이 데이터는 편집자 외에는 읽을 수 없게 막혀 있습니다.</p>
      <div class="row" style="margin-top:10px"><button type="button" class="btn" data-act="hhoff">이 기기에서 가구 공유 끄기</button></div>`;
  } else if(householdAvailable){
    h += `<p class="hint">이 앱에 가구 공유 데이터가 있습니다. 전환하면 이 기기의 데이터 대신 가구 데이터를 씁니다.</p>
      <div class="row" style="margin-top:10px"><button type="button" class="btn primary" data-act="hhjoin">가구 데이터로 전환</button></div>`;
  } else {
    h += `<p class="hint">가구 공유를 켜면 지금 데이터를 공유 공간으로 옮기고, 편집자로 초대한 배우자분과 함께 보고 고칠 수 있습니다.</p>
      <div class="row" style="margin-top:10px"><button type="button" class="btn primary" data-act="hhon">가구 공유 시작</button></div>`;
  }
  h += `</section>`;
  h += `<section><h2>데이터</h2><p class="hint" id="status">${esc(S._status||"")}</p>
    <div class="row" style="margin-top:10px"><button type="button" class="btn" data-act="sample">예시로 채워보기</button><button type="button" class="btn primary" data-act="savefile">JSON 파일로 저장</button><label class="btn" style="color:var(--ink);font-size:14px;cursor:pointer">JSON 파일 불러오기<input type="file" accept=".json,application/json" data-file="1" style="display:none"></label><button type="button" class="btn" data-act="export">아래 칸에 표시</button><button type="button" class="btn" data-act="import">칸 내용 불러오기</button>
    ${pendingReset?`<span class="confirm" style="margin:0">모두 지울까요?<div><button type="button" class="btn sm" data-act="resetno">취소</button><button type="button" class="btn sm dangerfill" data-act="resetyes">모두 삭제</button></div></span>`:`<button type="button" class="btn danger" data-act="reset">모두 삭제</button>`}</div>
    <label style="margin-top:12px">JSON<textarea id="jsonBox" rows="6" placeholder="내보내기를 누르면 여기에 나타납니다. 불러올 때는 여기에 붙여넣고 불러오기를 누르세요."></textarea></label></section>`;
  return h;
}

/* replace every account (sample, reset, import) while remembering what was removed */
function replaceAll(ns){
  const now = Date.now(), del = Object.assign({}, S.deleted||{});
  (S.accounts||[]).forEach(a=>{ del[a.id] = now; });
  (ns.accounts||[]).forEach(a=>{ a.id = a.id || uid(); a.updatedAt = now+1; });
  const ui = S.ui;
  S = Object.assign(blankState(), ns, {ui, deleted:del, settingsAt:now});
}
/* ================= events ================= */
function onClick(e){
  if(fltOpen && !e.target.closest(".dd")){ fltOpen = false; const d = app().querySelector(".dd"); if(d){ d.classList.remove("open"); d.querySelector(".ddbtn").setAttribute("aria-expanded","false"); } }
  const el = e.target.closest("[data-act]"); if(!el) return;
  const act = el.dataset.act;
  if(act==="tab"){ if(view==="edit") draft=null; go(el.dataset.tab); return; }
  if(act==="scn"){ S.ui.scenario = el.dataset.v; animateChart = true; commitUi(); render(); return; }
  if(act==="real"){ S.ui.real = el.dataset.v==="1"; animateChart = true; commitUi(); render(); return; }
  if(act==="death"){ S.ui.deathAge = Math.max(40, Math.min(100, num(S.ui.deathAge)+num(el.dataset.d))); commitUi(); render(); return; }
  if(act==="sel"){ selectAge(num(el.dataset.age)); commitUi(); return; }
  if(act==="fltmenu"){ fltOpen = !fltOpen; const d = app().querySelector(".dd"); if(d){ d.classList.toggle("open", fltOpen); d.querySelector(".ddbtn").setAttribute("aria-expanded", fltOpen); } return; }
  if(act==="del"){ pendingDel = el.dataset.id; render(); return; }
  if(act==="delno"){ pendingDel = null; render(); return; }
  if(act==="delyes"){ const id = el.dataset.id; S.deleted = S.deleted||{}; S.deleted[id] = Date.now(); S.accounts = S.accounts.filter(a=>a.id!==id); pendingDel = null; commit(); render(); return; }
  if(act==="edit"){ draft = JSON.parse(JSON.stringify(S.accounts.find(a=>a.id===el.dataset.id))); go("edit"); return; }
  if(act==="new"){ draft = {id:uid(), owner:el.dataset.owner, type:"nps", name:"국민연금"}; go("edit"); return; }
  if(act==="save"){
    const i = S.accounts.findIndex(a=>a.id===draft.id);
    if(!draft.name) draft.name = TYPES[draft.type].label;
    draft.updatedAt = Date.now();
    if(i>=0) S.accounts[i] = draft; else S.accounts.push(draft);
    draft = null; commit(); go("accounts"); return;
  }
  if(act==="sample"){ replaceAll(sampleState()); commit(); go("flow"); return; }
  if(act==="reset"){ pendingReset = true; render(); return; }
  if(act==="resetno"){ pendingReset = false; render(); return; }
  if(act==="resetyes"){ replaceAll(blankState()); pendingReset = false; commit(); render(); setStatus("모두 삭제했습니다."); return; }
  if(act==="legend"){
    S.ui.legendHidden = !S.ui.legendHidden; commitUi();
    const lg = app().querySelector(".chartwrap .legend");
    if(lg) lg.hidden = !!S.ui.legendHidden;
    el.textContent = S.ui.legendHidden ? "범례 보기 ▾" : "범례 숨기기 ▴";
    el.setAttribute("aria-expanded", String(!S.ui.legendHidden));
    return;
  }
  if(act==="savefile"){ saveFile(); return; }
  if(act==="schadd"){ draft.schedule = draft.schedule||[]; const last = draft.schedule[draft.schedule.length-1]; draft.schedule.push({from: last && num(last.to) ? num(last.to)+1 : "", to:"", monthly:""}); render(); return; }
  if(act==="schdel"){ draft.schedule.splice(num(el.dataset.i),1); render(); return; }
  if(act==="flt"){
    const id = el.dataset.id;
    if(id==="all") S.ui.filter = null;
    else { let f = S.ui.filter ? S.ui.filter.slice() : []; f = f.includes(id) ? f.filter(x=>x!==id) : f.concat(id); S.ui.filter = f.length ? f : null; }
    fltOpen = true; animateChart = true; commitUi(); render(); return;
  }
  if(act==="hhon"){ if(!dbH){ setStatus("계정 연결이 안 되어 가구 공유를 켤 수 없습니다."); return; } setMode("household"); attach(false); householdAvailable = true; render(); setStatus("가구 공유를 켰습니다. 공유 공간에 올리는 중…"); return; }
  if(act==="hhjoin"){ if(!dbH) return; setMode("household"); attach(true); render(); return; }
  if(act==="hhoff"){ setMode("private"); attach(false); render(); setStatus("이 기기는 개인 저장으로 돌아왔습니다. 가구 데이터는 그대로 남아 있어요."); return; }
  if(act==="export"){ const d = JSON.parse(JSON.stringify(S)); delete d._status; const box = document.getElementById("jsonBox"); box.value = JSON.stringify(d); box.select(); try{ navigator.clipboard.writeText(box.value).catch(()=>{}); }catch{} setStatus("JSON을 아래 칸에 표시했습니다. 복사해서 보관하세요."); return; }
  if(act==="import"){ importText(document.getElementById("jsonBox").value); return; }
  if(false){
    try{ const d = JSON.parse(document.getElementById("jsonBox").value); if(!d.accounts||!d.settings) throw 0; replaceAll(Object.assign(blankState(), d)); commit(); render(); setStatus("불러왔습니다."); }
    catch{ setStatus("JSON 형식이 맞지 않아 불러오지 못했습니다."); }
    return;
  }
}
function exportData(){ const d = JSON.parse(JSON.stringify(S)); delete d._status; d.exportedAt = new Date().toISOString(); return d; }
async function saveFile(){
  const json = JSON.stringify(exportData(), null, 2);
  const d = new Date(), pad = n=>String(n).padStart(2,"0");
  const filename = `우리집연금_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.json`;
  let dl = null;
  try{ dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; }catch{}
  if(dl){
    try{ await dl.save({filename, data:json}); setStatus(`${filename} 파일로 저장했습니다.`); }
    catch(err){
      const c = err && err.code;
      if(c==="declined") setStatus("파일 저장을 취소했습니다.");
      else if(c==="rate_limited") setStatus("저장 창이 이미 열려 있습니다. 잠시 후 다시 눌러 주세요.");
      else { setStatus("이 화면에서는 파일 저장을 쓸 수 없어 아래 칸에 표시했습니다. 복사해서 보관하세요."); const box = document.getElementById("jsonBox"); if(box){ box.value = json; box.select(); } }
    }
    return;
  }
  // outside the Claude viewer (plain browser): ordinary download
  try{
    const url = URL.createObjectURL(new Blob([json], {type:"application/json"}));
    const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1000); setStatus(`${filename} 파일로 저장했습니다.`);
  }catch{ const box = document.getElementById("jsonBox"); if(box){ box.value = json; box.select(); } setStatus("파일 저장이 안 되어 아래 칸에 표시했습니다."); }
}
/* files from the earlier app kept cash + holdings instead of principal/earnings */
function migrateAccount(a){
  if(TYPES[a.type] && TYPES[a.type].invest && (a.paid===undefined || a.paid==="") && (a.cash!==undefined || Array.isArray(a.holdings))){
    const hs = a.holdings||[];
    a.paid = Math.round(num(a.cash) + hs.reduce((s,h)=>s+num(h.q)*num(h.a),0));
    a.earn = Math.round(hs.reduce((s,h)=>s+num(h.q)*(num(h.p)-num(h.a)),0));
  }
  if(!TYPES[a.type]) a.type = "etc";
  return a;
}
function importText(t){
  try{ const d = JSON.parse(t); if(!d || !Array.isArray(d.accounts) || !d.settings) throw 0;
    d.accounts = d.accounts.map(migrateAccount);
    d.settings = Object.assign({}, blankState().settings, d.settings, {confirmed:true});
    delete d.exportedAt; replaceAll(Object.assign(blankState(), d)); commit(); render(); setStatus(`불러왔습니다. 계좌 ${S.accounts.length}개.`); }
  catch{ setStatus("JSON 형식이 맞지 않아 불러오지 못했습니다."); }
}
function onInput(e){
  const el = e.target;
  if(el.dataset.sch!==undefined && draft){ const r = draft.schedule[num(el.dataset.sch)]; if(r) r[el.dataset.sf] = el.value===""?"":+el.value;
    const pv = app().querySelector("[data-preview]"); if(pv && TYPES[draft.type].invest) pv.innerHTML = planPreview(draft); return; }
  if(el.dataset.file && e.type==="change"){
    const f = el.files && el.files[0]; if(!f) return;
    const r = new FileReader(); r.onload = ()=>importText(String(r.result)); r.onerror = ()=>setStatus("파일을 읽지 못했습니다."); r.readAsText(f);
    el.value = ""; return;
  }
  if(el.dataset.f && draft){
    const k = el.dataset.f;
    draft[k] = el.type==="checkbox" ? el.checked : (el.tagName==="SELECT" || el.type==="text") ? el.value : (el.value===""?"":+el.value);
    if(el.dataset.money){ const c = app().querySelector(`[data-conv="${k}"]`); if(c) c.textContent = convText(el.value, el.dataset.money); }
    { const pv = app().querySelector("[data-preview]"); if(pv && TYPES[draft.type].annuity) pv.innerHTML = annuityPreview(draft); if(pv && TYPES[draft.type].invest) pv.innerHTML = planPreview(draft); }
    if(el.dataset.redraw && e.type==="change"){
      if(k==="type"){ draft = {id:draft.id, owner:draft.owner, type:draft.type, name:TYPES[draft.type].label}; }
      render();
    }
    return;
  }
  if(el.dataset.set){
    S.settings[el.dataset.set] = num(el.value); S.settings.confirmed = true; S.settingsAt = Date.now(); commit();
    return;
  }
  if(el.dataset.actInput==="deathAge" && e.type==="change"){
    S.ui.deathAge = Math.max(40, Math.min(100, num(el.value))); commitUi(); render();
  }
}

/* ================= boot ================= */
document.addEventListener("DOMContentLoaded", ()=>{
  document.querySelector("nav").addEventListener("click", e=>{ const b = e.target.closest("button[data-tab]"); if(b){ draft=null; go(b.dataset.tab); } });
  app().addEventListener("click", onClick);
  app().addEventListener("input", onInput);
  app().addEventListener("change", onInput);
  loadLocal();
  render();
  setStatus("이 기기에 저장됨");
  connectDb();
});
</script>
